spring.datasource.url=jdbc:h2:mem:plantcare
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=true
springdoc.api-docs.path=/v3/api-docs


# Local development default only; production must set API_KEY (see application-prod.properties)
api.key=${API_KEY:demo-key-2026}


spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Render (and most hosts) tell the app which port to listen on via PORT
server.port=${PORT:8080}
