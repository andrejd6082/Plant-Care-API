# Production settings, active when SPRING_PROFILES_ACTIVE=prod.
# Every value here comes from the host's environment variables, never from the repo.

# Postgres (e.g. Neon). DB_URL is a JDBC URL:
#   jdbc:postgresql://<host>/<database>?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Keep data between restarts: create missing tables/columns, never drop.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No H2 database console on the public server
spring.h2.console.enabled=false

# No fallback key in production: startup fails if API_KEY is not set
api.key=${API_KEY}

# Must list the deployed frontend's URL, e.g. https://plant-care.netlify.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
